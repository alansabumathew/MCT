<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#222;">
  <div style="text-align:center;padding:20px 0;border-bottom:3px solid #068d9d;">
    <img src="cid:logo" alt="{{trust_name}}" style="max-height:90px;">
  </div>
  <h2 style="color:#068d9d;">Your donation receipt</h2>
  <p>Dear {{name}},</p>
  <p>Your donation has been verified. Thank you for your support! Your official receipt is attached as a PDF.</p>
  <table style="border-collapse:collapse;width:100%;margin:16px 0;">
    <tr><td style="padding:8px;border:1px solid #ddd;">Receipt No.</td><td style="padding:8px;border:1px solid #ddd;"><strong>{{receipt_no}}</strong></td></tr>
    <tr><td style="padding:8px;border:1px solid #ddd;">Date</td><td style="padding:8px;border:1px solid #ddd;">{{date}}</td></tr>
    <tr><td style="padding:8px;border:1px solid #ddd;">Amount</td><td style="padding:8px;border:1px solid #ddd;"><strong>&#8377;{{amount}}</strong></td></tr>
  </table>
  <p style="font-size:12px;color:#555;">{{tax_note}}</p>
  <p>With gratitude,<br><strong>{{trust_name}}</strong><br>{{trust_email}}</p>
</div>
